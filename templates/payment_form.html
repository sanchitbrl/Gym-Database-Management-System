{% extends "base.html" %}
{% block title %}Record Payment{% endblock %}
{% block content %}

<div class="page-header">
  <h3>Record Payment</h3>
</div>

<div class="table-container">
  <form method="POST">
    <div class="row g-3">
      <div class="col-md-6">
        <label class="form-label">Member</label>
        <select class="form-select" name="member_id" required>
          <option value="">-- Select Member --</option>
          {% for m in members %}
          <option value="{{ m.member_id }}">{{ m.name }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="col-md-6">
        <label class="form-label">Amount (Rs.)</label>
        <input type="number" step="0.01" class="form-control" name="amount" required>
      </div>
      <div class="col-md-6">
        <label class="form-label">Payment Date</label>
        <input type="date" class="form-control" name="payment_date" required>
      </div>
      <div class="col-md-6">
        <label class="form-label">Payment Mode</label>
        <select class="form-select" name="payment_mode">
          {% for mode in ['Cash','Card','UPI','Online'] %}
          <option value="{{ mode }}">{{ mode }}</option>
          {% endfor %}
        </select>
      </div>
    </div>

    <div class="mt-4">
      <button type="submit" class="btn btn-primary-custom">Save</button>
      <a href="{{ url_for('payments') }}" class="btn btn-outline-secondary">Cancel</a>
    </div>
  </form>
</div>

{% endblock %}
