<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}Gym Management System{% endblock %}</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

<header class="site-header">
  <div class="header-inner">
    <a class="brand" href="{{ url_for('dashboard') }}">
      <span class="brand-icon">🏋️</span>
      <span>SwasthaZone Gym</span>
    </a>
    <button class="nav-toggle" id="navToggle" aria-label="Menu">☰</button>
    <nav class="site-nav" id="siteNav">
      <a href="{{ url_for('dashboard') }}">Dashboard</a>
      <a href="{{ url_for('members') }}">Members</a>
      <a href="{{ url_for('trainers') }}">Trainers</a>
      <a href="{{ url_for('plans') }}">Plans</a>
      <a href="{{ url_for('payments') }}">Payments</a>
      <a href="{{ url_for('equipment') }}">Equipment</a>
      <a href="{{ url_for('attendance') }}">Attendance</a>
      <a href="{{ url_for('history') }}" class="nav-history">History</a>
    </nav>
  </div>
</header>

<script>
  document.getElementById('navToggle').addEventListener('click', function () {
    document.getElementById('siteNav').classList.toggle('open');
  });
</script>

<div class="container-fluid px-4 py-4">
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
      {% for category, message in messages %}
        <div class="alert alert-{{ 'success' if category=='success' else 'info' }} alert-dismissible fade show" role="alert">
          {{ message }}
          <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
      {% endfor %}
    {% endif %}
  {% endwith %}

  {% block content %}{% endblock %}
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
